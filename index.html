<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Creative Notification Panel</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Background Glow -->

    <div class="bg-glow"></div>

    <!-- Notification Button -->

    <div class="wrapper">

        <button id="notifyBtn">

            🔔

            <span class="badge">
                5
            </span>

        </button>

        <!-- Notification Panel -->

        <div class="panel"
            id="panel">

            <div class="panel-header">

                <h2>
                    Notifications
                </h2>

                <span>
                    Today
                </span>

            </div>

            <!-- Notification -->

            <div class="item">

                <div class="icon purple">
                    💬
                </div>

                <div class="text">

                    <h3>
                        New Message
                    </h3>

                    <p>
                        Emma sent you a message.
                    </p>

                </div>

                <span class="time">
                    2m
                </span>

            </div>

            <!-- Notification -->

            <div class="item">

                <div class="icon blue">
                    🚀
                </div>

                <div class="text">

                    <h3>
                        Project Updated
                    </h3>

                    <p>
                        Dashboard UI uploaded successfully.
                    </p>

                </div>

                <span class="time">
                    10m
                </span>

            </div>

            <!-- Notification -->

            <div class="item">

                <div class="icon green">
                    ✅
                </div>

                <div class="text">

                    <h3>
                        Payment Received
                    </h3>

                    <p>
                        ₹12,000 credited to wallet.
                    </p>

                </div>

                <span class="time">
                    1h
                </span>

            </div>

            <!-- Notification -->

            <div class="item">

                <div class="icon red">
                    🔥
                </div>

                <div class="text">

                    <h3>
                        Trending Post
                    </h3>

                    <p>
                        Your post reached 5K views.
                    </p>

                </div>

                <span class="time">
                    3h
                </span>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
